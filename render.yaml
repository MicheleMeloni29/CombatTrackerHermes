services:
  - type: web
    name: todo-app-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python backend/manage.py collectstatic --noinput
    preDeployCommand: python backend/manage.py migrate
    startCommand: gunicorn config.wsgi:application --chdir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://combat-tracker-hermes.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://combat-tracker-hermes.vercel.app
      - key: SECURE_SSL_REDIRECT
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: todo-app-db
          property: connectionString

databases:
  - name: todo-app-db
    plan: free
    databaseName: todo_app
    user: todo_app
